<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 120" width="350" height="120">
    <!-- Emblem Background -->
    <rect x="0" y="0" width="350" height="120" fill="transparent" />
    
    <!-- Stylized Person/Star in Gear (Left Side) -->
    <g transform="translate(40, 60)">
        <circle cx="0" cy="0" r="35" fill="none" stroke="#e0e0e0" stroke-width="8" stroke-dasharray="10 5" />
        <circle cx="0" cy="0" r="28" fill="none" stroke="#2563eb" stroke-width="4" />
        <!-- Person Icon -->
        <circle cx="0" cy="-8" r="6" fill="#f59e0b" />
        <path d="M -12 12 Q 0 0 12 12 L 8 20 L -8 20 Z" fill="#f59e0b" />
    </g>
    
    <!-- Text Section (Right Side) -->
    <g transform="translate(95, 55)">
        <text x="0" y="0" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="32" font-weight="900" fill="#1e3a8a">Skill India</text>
        <text x="0" y="25" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="0.5">कौशल भारत - कुशल भारत</text>
        
        <!-- Tricolor Underline -->
        <rect x="0" y="35" width="40" height="3" fill="#f97316" />
        <rect x="40" y="35" width="40" height="3" fill="#e2e8f0" />
        <rect x="80" y="35" width="40" height="3" fill="#15803d" />
    </g>
</svg>
